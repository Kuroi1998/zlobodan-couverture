name: CI - Integration Continue

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validation, Tests & Compilation Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configuration de Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types TypeScript
        run: npm run typecheck

      - name: Vérification du Linting ESLint
        run: npm run lint:strict

      - name: Vérification de la contrainte de taille (< 400 lignes)
        run: npm run check:size

      - name: Exécution des tests automatisés Vitest
        run: npm run test

      - name: Compilation Next.js SSG
        run: npm run build
