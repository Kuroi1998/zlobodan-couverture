name: CI - qualité et flux persistants

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Types, migrations, tests et build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zlobodan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          # Mailpit refuse l'authentification SMTP en clair sans ce drapeau et
          # s'arrête au démarrage. Le trafic reste confiné au réseau du runner.
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zlobodan_test
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zlobodan_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zlobodan_test
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zlobodan_e2e_test
      SESSION_SECRET: ci-only-session-secret-32-characters-long
      IP_HASH_SALT: ci-only-ip-hash-salt-32-characters-long-x
      TWO_FACTOR_ENCRYPTION_KEY: ci-only-two-factor-key-32-characters-long
      SESSION_COOKIE_NAME: zlobodan_ci_session
      APP_ORIGIN: http://127.0.0.1:3100
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ci
      SMTP_PASS: ci-only-smtp-password
      EMAIL_FROM: Zlobodan CI <no-reply@example.test>
      UPLOAD_STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIRECTORY: .tmp/ci-uploads

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurer Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la configuration
        run: npm run env:check

      - name: Appliquer les migrations
        run: npm run db:migrate

      - name: Vérifier PostgreSQL
        run: npm run db:check

      - name: Vérifier TypeScript, ESLint et la taille
        run: |
          npm run typecheck
          npm run lint:strict
          npm run check:size

      - name: Exécuter les tests unitaires
        run: npm run test

      - name: Exécuter les tests d'intégration PostgreSQL
        run: npm run test:integration

      - name: Compiler l'application
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Exécuter les parcours E2E
        run: npm run test:e2e

      - name: Expédier et vérifier les emails dans Mailpit
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/zlobodan_e2e_test
        run: |
          npm run notifications:dispatch
          node -e "fetch('http://127.0.0.1:8025/api/v1/messages').then(r=>{if(!r.ok)throw new Error('Mailpit '+r.status);return r.json()}).then(b=>{const n=b.total??b.messages?.length??0;if(n<1)throw new Error('Aucun email capturé');console.log(n+' email(s) capturé(s)')})"

      - name: Prouver la persistance après redémarrage
        run: npm run test:restart
