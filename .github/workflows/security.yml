name: Securite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Une vulnerabilite peut etre publiee sur une dependance figee : le depot
    # est donc reaudite chaque semaine, sans qu'un commit soit necessaire.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependances:
    name: Dependances et build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: npm

      # `npm ci` et jamais `npm install` : l'installation doit reproduire le
      # lockfile a l'identique, sans resoudre silencieusement une version plus
      # recente au moment du build.
      - name: Installation reproductible
        run: npm ci

      - name: Verification de la presence du lockfile
        run: test -f package-lock.json

      # Les outils de build font partie de la chaine d'approvisionnement :
      # les vulnerabilites hautes des dependances de developpement sont donc
      # bloquantes au meme titre que celles du code execute en production.
      - name: Audit des dependances (bloquant en high)
        run: npm audit --audit-level=high

      - name: Verification des types
        run: npm run typecheck

      # `next lint` a ete supprime en Next.js 16 : ESLint s execute directement,
      # via le script du projet pour que CI et poste local partagent la meme
      # commande.
      - name: Analyse statique ESLint
        run: npm run lint:strict

      - name: Build
        run: npm run build

      # Un secret qui atteint le bundle client est public. Verification par
      # recherche directe dans les artefacts produits.
      - name: Absence de secret dans le bundle client
        run: node scripts/check-client-bundle.js

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-24.04
    container:
      image: zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Historique complet : un secret retire au commit suivant reste
          # present dans l'historique et donc toujours compromis.
          fetch-depth: 0

      # Gitleaks est invoque directement plutot que via son action GitHub.
      # L'action scanne l'intervalle `<base>^..<head>` du push ; lorsque la base
      # est le commit racine du depot, `<base>^` n'existe pas et le scan echoue
      # sans rien avoir lu. Un scan explicite de tout l'historique est
      # deterministe, quel que soit l'evenement declencheur.
      #
      # `--redact` : une correspondance ne doit jamais atterrir en clair dans un
      # journal d'execution public.
      #
      # `--log-opts HEAD` restreint le scan a l'ascendance de la ref testee.
      # Sans cette borne, gitleaks parcourt *toutes* les refs recuperees par le
      # checkout, y compris `archive/legacy-zlobodan` : chaque execution
      # rejouerait alors l'ancien depot, dont la documentation d'API contenait
      # des charges JSON d'exemple que la regle `generic-api-key` signale a
      # tort. L'historique complet de la branche reste couvert.
      - name: Gitleaks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if gitleaks git --help >/dev/null 2>&1; then
            gitleaks git --redact --verbose --log-opts HEAD .
          else
            gitleaks detect --source=. --redact --verbose --log-opts HEAD
          fi

  semgrep:
    name: Analyse statique de securite
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep
        run: semgrep ci --config p/typescript --config p/nodejs --config p/owasp-top-ten
