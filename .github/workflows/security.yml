name: Securite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Une vulnerabilite peut etre publiee sur une dependance figee : le depot
    # est donc reaudite chaque semaine, sans qu'un commit soit necessaire.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependances:
    name: Dependances et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci` et jamais `npm install` : l'installation doit reproduire le
      # lockfile a l'identique, sans resoudre silencieusement une version plus
      # recente au moment du build.
      - name: Installation reproductible
        run: npm ci

      - name: Verification de la presence du lockfile
        run: test -f package-lock.json

      # Bloquant sur haute et critique. Les vulnerabilites moderees sont
      # signalees mais ne cassent pas la chaine, faute de quoi le bruit finit
      # par faire desactiver l'etape entiere.
      - name: Audit des dependances (bloquant en high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Verification des types
        run: npx tsc --noEmit

      - name: Analyse statique ESLint
        run: npx next lint --max-warnings=0

      - name: Build
        run: npm run build

      # Un secret qui atteint le bundle client est public. Verification par
      # recherche directe dans les artefacts produits.
      - name: Absence de secret dans le bundle client
        run: node scripts/check-client-bundle.js

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret retire au commit suivant reste
          # present dans l'historique et donc toujours compromis.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Analyse statique de securite
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep
        run: semgrep ci --config p/typescript --config p/nodejs --config p/owasp-top-ten --error
