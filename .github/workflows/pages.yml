name: Vitrine statique - GitHub Pages

# Publie la **vitrine publique** sur GitHub Pages.
#
# GitHub Pages ne sert que des fichiers statiques : il ne peut exécuter ni
# route handler, ni middleware, ni requête PostgreSQL. Ce workflow retire donc
# toutes les routes qui exigent un serveur avant de compiler, puis exporte le
# reste avec `output: "export"` (voir next.config.js).
#
# Ce que le site publié CONTIENT : accueil, à propos, services et pages de
# service, pages de ville, mentions légales, politique de confidentialité,
# robots.txt, sitemap.xml et security.txt.
#
# Ce que le site publié NE CONTIENT PAS : espace client, back-office,
# connexion, et l'ensemble des routes /api. En conséquence, les formulaires de
# contact et de devis s'affichent mais **ne peuvent pas être soumis** : leur
# point de terminaison n'existe pas sur un hébergement statique. Le déploiement
# de l'application complète exige un serveur Node (voir README, section 14).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compiler la vitrine
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurer Node.js 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          static_site_generator: next

      - name: Installer les dépendances
        run: npm ci

      # Chacune de ces routes exige un serveur : elles lisent une session, des
      # `searchParams` au rendu, ou exposent un route handler. `next build` avec
      # `output: "export"` échoue sur la première d'entre elles — c'est ce qui
      # faisait tomber ce workflow lorsque seules les quatre premières étaient
      # retirées : /reinitialisation-mot-de-passe interrompait le pré-rendu.
      - name: Retirer les routes exigeant un serveur
        run: |
          rm -rf \
            src/app/admin \
            src/app/mon-compte \
            src/app/connexion \
            src/app/api \
            src/app/confirmation-changement-email \
            src/app/reinitialisation-mot-de-passe \
            src/app/verification-email \
            src/app/mot-de-passe-oublie

      - name: Compiler l'export statique
        run: npx next build
        env:
          # Active `output: "export"` dans next.config.js. Sans ce drapeau, le
          # build est un build serveur complet.
          STATIC_EXPORT: "true"
          # Le site est servi sous https://<compte>.github.io/<dépôt>/ : sans ce
          # préfixe, toutes les ressources pointeraient à la racine du domaine.
          NEXT_PUBLIC_BASE_PATH: /zlobodan-couverture

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    name: Déployer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
